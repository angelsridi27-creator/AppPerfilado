<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfilado de Cadenas de Aisladores</title>
  <!-- Cargamos Chart.js para renderizar los gráficos en vivo -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #0d6efd;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #ced4da;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      color: var(--primary);
      text-align: center;
      font-size: 1.3rem;
    }
    .section-title {
      font-weight: bold;
      color: #495057;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 4px;
      margin: 15px 0 10px 0;
      font-size: 0.95rem;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 0.82rem;
    }
    select, input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 0.9rem;
    }
    .table-responsive {
      overflow-x: auto;
      margin-top: 10px;
    }
    table.matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    table.matrix th, table.matrix td {
      border: 1px solid var(--border);
      padding: 4px;
      text-align: center;
    }
    table.matrix th {
      background-color: #e9ecef;
      font-size: 0.75rem;
    }
    table.matrix input {
      width: 100%;
      padding: 4px;
      text-align: center;
      font-size: 0.85rem;
      border: none;
    }
    /* Estilos del Contenedor del Gráfico */
    .chart-container {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid #cbd5e1;
    }
    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn-sync {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 8px;
      width: 100%;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .status-message {
      text-align: center;
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Perfilado de Cadenas de Aisladores 1.2.0</h2>
  
  <form id="form-perfilado">
    
    <!-- 1. DATOS DE CABECERA -->
    <div class="section-title">1. Datos de Cabecera</div>
    
    <div class="grid-2">
      <div class="form-group">
        <label for="division">División</label>
        <select id="division" required>
          <option value="">Seleccione...</option>
          <option value="Cordoba">Córdoba</option>
          <option value="Reolin">Reolin</option>
          <option value="Isla Verde">Isla Verde</option>
          <option value="Levalle">Levalle</option>
        </select>
      </div>
      <div class="form-group">
        <label for="responsable">Jefe de Trabajo / Resp.</label>
        <select id="responsable" required><option value="">Seleccione División...</option></select>
      </div>
    </div>

    <div class="form-group">
      <label for="linea">Línea</label>
      <input type="text" id="linea" list="lista-lineas" placeholder="Buscar línea..." required autocomplete="off">
      <datalist id="lista-lineas"></datalist>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="perfilador">Perfilador / Marca Equipo</label>
        <input type="text" id="perfilador" placeholder="Ej: TEREX" required>
      </div>
      <div class="form-group">
        <label for="piquete">Piquete / Apoyo N°</label>
        <input type="text" id="piquete" placeholder="Ej: 19" required>
      </div>
    </div>

    <div class="form-group">
      <label for="tipoApoyo">Tipo de Apoyo / Cadena</label>
      <select id="tipoApoyo" required><option value="">Seleccione...</option></select>
    </div>

    <!-- 2. PLANILLA DE LECTURAS REGISTRADAS -->
    <div class="section-title">2. Planilla de Lecturas Registradas</div>

    <div class="grid-2">
      <div class="form-group">
        <label for="lado-a">Nombre Lado A</label>
        <input type="text" id="lado-a" placeholder="Ej: Totoral" value="LADO A">
      </div>
      <div class="form-group">
        <label for="lado-b">Nombre Lado B</label>
        <input type="text" id="lado-b" placeholder="Ej: La Dormida" value="LADO B">
      </div>
    </div>

    <div class="form-group">
      <label for="cant-aisladores">Cant. Aisladores por Cadena (1 al 12)</label>
      <select id="cant-aisladores">
        <option value="6" selected>6 Aisladores</option>
        <option value="7">7 Aisladores</option>
        <option value="8">8 Aisladores</option>
        <option value="9">9 Aisladores</option>
        <option value="10">10 Aisladores</option>
        <option value="11">11 Aisladores</option>
        <option value="12">12 Aisladores</option>
      </select>
    </div>

    <!-- MATRIZ DINÁMICA DE CARGA -->
    <div class="table-responsive">
      <table class="matrix">
        <thead>
          <tr id="tr-header-lados">
            <th rowspan="2">Ais. N°</th>
            <th colspan="3" id="th-lado-a">LADO A</th>
            <th colspan="3" id="th-lado-b">LADO B</th>
          </tr>
          <tr id="tr-subfases">
            <!-- Dinámico -->
          </tr>
        </thead>
        <tbody id="matrix-body">
          <!-- Celdas cargadas por JS -->
        </tbody>
      </table>
    </div>

    <!-- 3. GRÁFICO EN TIEMPO REAL -->
    <div class="section-title">3. Curva de Perfilado en Tiempo Real</div>
    <div class="chart-container">
      <div class="form-group">
        <label for="select-curva-fase">Ver Curva de:</label>
        <select id="select-curva-fase">
          <!-- Se actualiza automáticamente según las columnas activas -->
        </select>
      </div>
      <canvas id="perfilChart" height="200"></canvas>
    </div>

    <!-- 4. ESTADO GENERAL Y OBSERVACIONES -->
    <div class="section-title">4. Estado General y Observaciones</div>

    <div class="form-group">
      <label for="obs-tierra">Estado Tomas de Tierra</label>
      <input type="text" id="obs-tierra" placeholder="Normal / Regular / Dañado">
    </div>
    <div class="form-group">
      <label for="obs-aisladores">Estado de los Aisladores</label>
      <input type="text" id="obs-aisladores" placeholder="Observaciones físicas del plato/cadena">
    </div>
    <div class="form-group">
      <label for="observaciones">Observaciones Generales</label>
      <input type="text" id="observaciones" placeholder="Detalles adicionales">
    </div>

    <button type="submit" class="btn-submit" id="btn-guardar">Guardar y Sincronizar</button>
  </form>

  <button type="button" id="btn-force-sync" class="btn-sync">🔄 Forzar Sincronización de Catálogos</button>
  <div id="sync-status" class="status-message"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZneJSFTp4FZOrGP4AlYOjgLqV_odof8KmiYscquPDo9GYzrRMVNpLTkz4KF3-YxLk/exec";
  let catalogosGuardados = null;
  let esRetencion = false;
  let chartInstance = null;

  document.addEventListener("DOMContentLoaded", () => {
    inicializarGrafico();
    actualizarEstructuraMatriz();
    cargarDatosDesdeCache();
    setupEvents();
  });

  function esTipoRetencion(texto) {
    if (!texto) return false;
    const txt = texto.toUpperCase();
    return txt.includes("RET") || txt.includes("RETENCION") || txt.includes("DOBLE") || txt.includes("ANGULO");
  }

  function inicializarGrafico() {
    const ctx = document.getElementById('perfilChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [1, 2, 3, 4, 5, 6],
        datasets: [{
          label: 'Resultado Perfilado',
          data: [null, null, null, null, null, null],
          borderColor: '#0d6efd',
          backgroundColor: '#0d6efd',
          tension: 0.4, // Suavizado de la curva igual a la imagen de ejemplo
          borderWidth: 3,
          pointRadius: 5
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            title: { display: true, text: 'Aislador N° (desde conductor)' }
          },
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Resultado (kV / Valor)' }
          }
        }
      }
    });
  }

  function actualizarEstructuraMatriz() {
    const cant = parseInt(document.getElementById("cant-aisladores").value) || 6;
    const tipoSeleccionado = document.getElementById("tipoApoyo").value;
    esRetencion = esTipoRetencion(tipoSeleccionado);

    const thLadoA = document.getElementById("th-lado-a");
    const thLadoB = document.getElementById("th-lado-b");
    const trSubfases = document.getElementById("tr-subfases");

    const ladoANombre = document.getElementById("lado-a").value || "LADO A";
    const ladoBNombre = document.getElementById("lado-b").value || "LADO B";

    let fases = [];
    if (esRetencion) {
      thLadoA.colSpan = 6;
      thLadoB.colSpan = 6;
      trSubfases.innerHTML = `
        <th>I-Ext</th><th>I-Int</th><th>II-Ext</th><th>II-Int</th><th>III-Ext</th><th>III-Int</th>
        <th>I-Ext</th><th>I-Int</th><th>II-Ext</th><th>II-Int</th><th>III-Ext</th><th>III-Int</th>
      `;
      fases = ["I-Ext", "I-Int", "II-Ext", "II-Int", "III-Ext", "III-Int"];
    } else {
      thLadoA.colSpan = 3;
      thLadoB.colSpan = 3;
      trSubfases.innerHTML = `
        <th>I</th><th>II</th><th>III</th>
        <th>I</th><th>II</th><th>III</th>
      `;
      fases = ["I", "II", "III"];
    }

    // Actualizar el selector de fase para el gráfico
    const selectCurva = document.getElementById("select-curva-fase");
    const valorSeleccionadoPrevio = selectCurva.value;
    selectCurva.innerHTML = "";
    
    fases.forEach(f => {
      selectCurva.innerHTML += `<option value="A_${f}">${ladoANombre} - Fase ${f}</option>`;
    });
    fases.forEach(f => {
      selectCurva.innerHTML += `<option value="B_${f}">${ladoBNombre} - Fase ${f}</option>`;
    });

    if (valorSeleccionadoPrevio) selectCurva.value = valorSeleccionadoPrevio;

    // Renderizar la tabla
    const tbody = document.getElementById("matrix-body");
    tbody.innerHTML = "";

    for (let i = 1; i <= cant; i++) {
      const tr = document.createElement("tr");
      let html = `<td><b>${i}</b></td>`;

      fases.forEach(fase => {
        html += `<td><input type="number" step="any" class="cell-val" data-num="${i}" data-lado="A" data-fase="${fase}"></td>`;
      });
      fases.forEach(fase => {
        html += `<td><input type="number" step="any" class="cell-val" data-num="${i}" data-lado="B" data-fase="${fase}"></td>`;
      });

      tr.innerHTML = html;
      tbody.appendChild(tr);
    }

    actualizarGrafico();
  }

  function actualizarGrafico() {
    if (!chartInstance) return;

    const cant = parseInt(document.getElementById("cant-aisladores").value) || 6;
    const opcionCurva = document.getElementById("select-curva-fase").value; // Ej: "A_I" o "B_II-Ext"
    if (!opcionCurva) return;

    const [ladoSel, faseSel] = opcionCurva.split("_");

    let labels = [];
    let dataValues = [];

    for (let i = 1; i <= cant; i++) {
      labels.push(i);
      const input = document.querySelector(`.cell-val[data-num="${i}"][data-lado="${ladoSel}"][data-fase="${faseSel}"]`);
      if (input && input.value !== "") {
        dataValues.push(parseFloat(input.value));
      } else {
        dataValues.push(null);
      }
    }

    chartInstance.data.labels = labels;
    chartInstance.data.datasets[0].data = dataValues;
    chartInstance.update();
  }

  function setupEvents() {
    document.getElementById("cant-aisladores").addEventListener("change", actualizarEstructuraMatriz);
    document.getElementById("tipoApoyo").addEventListener("change", actualizarEstructuraMatriz);
    document.getElementById("select-curva-fase").addEventListener("change", actualizarGrafico);

    // Escuchar tipeo en las celdas para redibujar el gráfico inmediatamente
    document.getElementById("matrix-body").addEventListener("input", (e) => {
      if (e.target.classList.contains("cell-val")) {
        actualizarGrafico();
      }
    });

    document.getElementById("lado-a").addEventListener("input", (e) => {
      document.getElementById("th-lado-a").innerText = e.target.value.toUpperCase() || "LADO A";
      actualizarEstructuraMatriz();
    });
    document.getElementById("lado-b").addEventListener("input", (e) => {
      document.getElementById("th-lado-b").innerText = e.target.value.toUpperCase() || "LADO B";
      actualizarEstructuraMatriz();
    });

    document.getElementById("division").addEventListener("change", function() {
      const respSelect = document.getElementById("responsable");
      respSelect.innerHTML = '<option value="">Seleccione...</option>';
      if (this.value && catalogosGuardados && catalogosGuardados.responsables[this.value]) {
        catalogosGuardados.responsables[this.value].forEach(r => {
          respSelect.innerHTML += `<option value="${r}">${r}</option>`;
        });
      }
    });

    document.getElementById("btn-force-sync").addEventListener("click", sincronizarCatalogos);
    document.getElementById("form-perfilado").addEventListener("submit", enviarFormulario);
  }

  function cargarDatosDesdeCache() {
    const local = localStorage.getItem("catalogos_pwa");
    if (local) {
      catalogosGuardados = JSON.parse(local);
      poblarCatalogos(catalogosGuardados);
    }
  }

  function poblarCatalogos(data) {
    const listLineas = document.getElementById("lista-lineas");
    listLineas.innerHTML = "";
    data.lineas.forEach(l => listLineas.innerHTML += `<option value="${l}">`);

    const selTipo = document.getElementById("tipoApoyo");
    selTipo.innerHTML = '<option value="">Seleccione...</option>';
    data.tiposApoyo.forEach(t => selTipo.innerHTML += `<option value="${t}">${t}</option>`);
  }

  function sincronizarCatalogos() {
    const btn = document.getElementById("btn-force-sync");
    btn.disabled = true;
    btn.innerText = "⏳ Sincronizando...";

    fetch(`${SCRIPT_URL}?nocache=${new Date().getTime()}`)
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          catalogosGuardados = res.data;
          localStorage.setItem("catalogos_pwa", JSON.stringify(res.data));
          poblarCatalogos(res.data);
          document.getElementById("sync-status").innerText = "✅ Catálogos sincronizados.";
        }
      })
      .catch(() => document.getElementById("sync-status").innerText = "❌ Error al sincronizar.")
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "🔄 Forzar Sincronización de Catálogos";
      });
  }

  function enviarFormulario(e) {
    e.preventDefault();

    const mediciones = [];
    const ladoANombre = document.getElementById("lado-a").value || "LADO A";
    const ladoBNombre = document.getElementById("lado-b").value || "LADO B";

    document.querySelectorAll(".cell-val").forEach(input => {
      if (input.value !== "") {
        mediciones.push({
          lado: input.dataset.lado === "A" ? ladoANombre : ladoBNombre,
          fase: input.dataset.fase,
          numAislador: input.dataset.num,
          valor: input.value
        });
      }
    });

    if (mediciones.length === 0) {
      alert("Ingrese al menos un valor de aislador en la tabla.");
      return;
    }

    const payload = {
      division: document.getElementById("division").value,
      responsable: document.getElementById("responsable").value,
      linea: document.getElementById("linea").value,
      perfilador: document.getElementById("perfilador").value,
      piquete: document.getElementById("piquete").value,
      tipoApoyo: document.getElementById("tipoApoyo").value,
      obsTierra: document.getElementById("obs-tierra").value,
      obsAisladores: document.getElementById("obs-aisladores").value,
      observaciones: document.getElementById("observaciones").value,
      mediciones: mediciones
    };

    const btnGuardar = document.getElementById("btn-guardar");
    btnGuardar.disabled = true;
    btnGuardar.innerText = "Guardando...";

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(res => {
      if (res.status === "success") {
        alert("✅ Mediciones registradas correctamente.");
        document.getElementById("form-perfilado").reset();
        actualizarEstructuraMatriz();
      } else {
        alert("Error: " + res.message);
      }
    })
    .catch(() => alert("❌ Error de red al intentar guardar."))
    .finally(() => {
      btnGuardar.disabled = false;
      btnGuardar.innerText = "Guardar y Sincronizar";
    });
  }
</script>
</body>
</html>
