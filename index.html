<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfilado de Aisladores</title>
  <style>
    :root {
      --primary: #0d6efd; /* Color azul del título y botones principales */
      --background: #f8f9fa;
      --surface: #ffffff;
      --text: #212529;
      --border: #ced4da;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--background);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: var(--surface);
      width: 100%;
      max-width: 500px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    h2 {
      color: var(--primary);
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .card {
      background-color: #f1f3f5;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:active {
      background-color: #0b5ed7;
    }

    /* Estilos del nuevo botón de sincronización */
    .btn-sync {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.2s;
    }

    .btn-sync:active {
      background-color: #5c636a;
    }

    .status-message {
      text-align: center;
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      min-height: 20px;
    }

    .status-success { color: #198754; }
    .status-error { color: #dc3545; }
    .status-warning { color: #ffc107; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Título actualizado -->
    <h2>Perfilado de Aisladores 1.1.1</h2>
    
    <form id="form-perfilado">
      
      <!-- 1. División -->
      <div class="form-group">
        <label for="division">División</label>
        <select id="division" required>
          <option value="">Seleccione División...</option>
          <option value="Cordoba">Córdoba</option>
          <option value="Reolin">Reolin</option>
          <option value="Isla Verde">Isla Verde</option>
          <option value="Levalle">Levalle</option>
        </select>
      </div>

      <!-- 2. Responsable -->
      <div class="form-group">
        <label for="responsable">Responsable</label>
        <select id="responsable" required>
          <option value="">Seleccione primero la División...</option>
        </select>
      </div>

      <!-- 3. Línea -->
      <div class="form-group">
        <label for="linea">Línea</label>
        <input type="text" id="linea" list="lista-lineas" placeholder="Escriba para buscar línea..." required autocomplete="off">
        <datalist id="lista-lineas"></datalist>
      </div>

      <!-- 4. Perfilador -->
      <div class="form-group">
        <label for="perfilador">Perfilador</label>
        <input type="text" id="perfilador" placeholder="Nombre/Código del perfilador" required>
      </div>

      <!-- 5. Piquete -->
      <div class="form-group">
        <label for="piquete">Piquete</label>
        <input type="text" id="piquete" placeholder="Número de piquete" required>
      </div>

      <!-- 6. Tipo de Apoyo -->
      <div class="form-group">
        <label for="tipoApoyo">Tipo de Apoyo</label>
        <select id="tipoApoyo" required>
          <option value="">Seleccione Tipo de Apoyo...</option>
        </select>
      </div>

      <!-- Valores de Perfilado (como en tu diseño original) -->
      <div class="card">
        <label style="margin-bottom: 10px; font-size: 1rem;">Valores de Perfilado por Cadena</label>
        
        <div class="form-group">
          <label style="font-size: 0.8rem; color: #555;">F1</label>
          <input type="number" id="valorF1" placeholder="Valor numérico" step="0.01">
        </div>
        <div class="form-group">
          <label style="font-size: 0.8rem; color: #555;">F2</label>
          <input type="number" id="valorF2" placeholder="Valor numérico" step="0.01">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label style="font-size: 0.8rem; color: #555;">F3</label>
          <input type="number" id="valorF3" placeholder="Valor numérico" step="0.01">
        </div>
      </div>

      <button type="submit" class="btn-primary" id="btn-guardar">Guardar y Sincronizar</button>
    </form>

    <!-- Botón Forzar Sincronización agregado al final -->
    <button type="button" id="btn-force-sync" class="btn-sync">🔄 Forzar Sincronización de Catálogos</button>
    <div id="sync-status" class="status-message">Verificando catálogos...</div>
  </div>

  <script>
    // ==========================================
    // ¡IMPORTANTE! COLOCA TU URL DE APPS SCRIPT AQUÍ
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZneJSFTp4FZOrGP4AlYOjgLqV_odof8KmiYscquPDo9GYzrRMVNpLTkz4KF3-YxLk/exec";

    let catalogosGuardados = null;

    // Elementos del DOM
    const selDivision = document.getElementById("division");
    const selResponsable = document.getElementById("responsable");
    const listLineas = document.getElementById("lista-lineas");
    const selTipoApoyo = document.getElementById("tipoApoyo");
    const statusDiv = document.getElementById("sync-status");
    const btnSync = document.getElementById("btn-force-sync");
    const btnGuardar = document.getElementById("btn-guardar");

    // Inicializar al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
      cargarDatosDesdeCache();
    });

    // 1. CARGAR DATOS EN EL FORMULARIO
    function cargarDatosDesdeCache() {
      const dataStr = localStorage.getItem("catalogos_pwa");
      if (dataStr) {
        catalogosGuardados = JSON.parse(dataStr);
        poblarFormulario(catalogosGuardados);
        mostrarEstado("✅ Catálogos offline listos.", "status-success");
      } else {
        mostrarEstado("⚠️ No hay catálogos. Requiere sincronizar.", "status-error");
      }
    }

    function poblarFormulario(data) {
      // Poblar datalist de Líneas
      listLineas.innerHTML = "";
      data.lineas.forEach(linea => {
        let option = document.createElement("option");
        option.value = linea;
        listLineas.appendChild(option);
      });

      // Poblar Select Tipo Apoyo
      selTipoApoyo.innerHTML = '<option value="">Seleccione Tipo de Apoyo...</option>';
      data.tiposApoyo.forEach(tipo => {
        let option = document.createElement("option");
        option.value = tipo;
        option.innerText = tipo;
        selTipoApoyo.appendChild(option);
      });
    }

    // 2. LÓGICA DE CASCADA (División -> Responsable)
    selDivision.addEventListener("change", function() {
      const divisionElegida = this.value;
      selResponsable.innerHTML = '<option value="">Seleccione Responsable...</option>';
      
      if (!divisionElegida || !catalogosGuardados) return;

      // Obtener responsables según división (Ej: "Cordoba", "Reolin")
      const responsables = catalogosGuardados.responsables[divisionElegida] || [];
      responsables.forEach(resp => {
        let option = document.createElement("option");
        option.value = resp;
        option.innerText = resp;
        selResponsable.appendChild(option);
      });
    });

    // 3. FORZAR SINCRONIZACIÓN MANUAL (Nuevo Botón)
    btnSync.addEventListener("click", function() {
      if (!navigator.onLine) {
        alert("Necesitas conexión a internet para sincronizar.");
        return;
      }

      btnSync.disabled = true;
      btnSync.innerText = "⏳ Sincronizando...";
      mostrarEstado("Conectando con la planilla...", "");

      // Evitar caché agregando un timestamp a la URL
      fetch(`${SCRIPT_URL}?nocache=${new Date().getTime()}`)
        .then(response => {
          if (!response.ok) throw new Error("Error de red");
          return response.json();
        })
        .then(result => {
          if (result.status === "success") {
            // Guardar en la memoria del navegador
            localStorage.setItem("catalogos_pwa", JSON.stringify(result.data));
            catalogosGuardados = result.data;
            poblarFormulario(catalogosGuardados);
            
            // Refrescar responsables si hay una división seleccionada
            selDivision.dispatchEvent(new Event('change'));
            
            mostrarEstado("✅ Catálogos actualizados y guardados.", "status-success");
          } else {
            throw new Error(result.message || "Respuesta incorrecta");
          }
        })
        .catch(err => {
          console.error(err);
          mostrarEstado("❌ Error al sincronizar.", "status-error");
        })
        .finally(() => {
          btnSync.disabled = false;
          btnSync.innerText = "🔄 Forzar Sincronización de Catálogos";
        });
    });

    // 4. GUARDAR Y ENVIAR DATOS (POST)
    document.getElementById("form-perfilado").addEventListener("submit", function(e) {
      e.preventDefault();

      if (!navigator.onLine) {
        alert("Estás sin conexión. Por favor, conéctate a internet para enviar los datos.");
        // Nota: Si quieres guardar localmente y enviar luego, requeriría lógica extra (IndexedDB)
        return;
      }

      // Preparar el array de mediciones
      let mediciones = [];
      const valF1 = document.getElementById("valorF1").value;
      const valF2 = document.getElementById("valorF2").value;
      const valF3 = document.getElementById("valorF3").value;

      // El N° Aislador por defecto será 1 según tu diseño, pero asignamos la fase F1, F2, F3
      if (valF1) mediciones.push({ fase: "F1", aisladorNum: 1, valor: valF1 });
      if (valF2) mediciones.push({ fase: "F2", aisladorNum: 1, valor: valF2 });
      if (valF3) mediciones.push({ fase: "F3", aisladorNum: 1, valor: valF3 });

      if (mediciones.length === 0) {
        alert("Debe ingresar al menos un valor de medición (F1, F2 o F3).");
        return;
      }

      // Estructura que espera el doPost de tu Apps Script
      const payload = {
        division: selDivision.value,
        responsable: selResponsable.value,
        linea: document.getElementById("linea").value,
        perfilador: document.getElementById("perfilador").value,
        piquete: document.getElementById("piquete").value,
        tipoApoyo: selTipoApoyo.value,
        mediciones: mediciones
      };

      btnGuardar.disabled = true;
      btnGuardar.innerText = "Enviando...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          alert("✅ Datos guardados correctamente en la planilla.");
          document.getElementById("form-perfilado").reset();
          // Limpiar el combo de responsables
          selResponsable.innerHTML = '<option value="">Seleccione primero la División...</option>';
        } else {
          alert("❌ Error desde el servidor: " + res.message);
        }
      })
      .catch(err => {
        alert("❌ Error de conexión al enviar los datos.");
        console.error(err);
      })
      .finally(() => {
        btnGuardar.disabled = false;
        btnGuardar.innerText = "Guardar y Sincronizar";
      });
    });

    // Función auxiliar para mostrar mensajes
    function mostrarEstado(mensaje, claseCss) {
      statusDiv.innerText = mensaje;
      statusDiv.className = `status-message ${claseCss}`;
    }
  </script>
</body>
</html>
